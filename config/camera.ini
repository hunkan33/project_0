; 摄像头能力表 —— 程序自动生成，手改无效（下次启动会被覆盖）
; 指纹 = card + bus + serial；三者任一变化就重新枚举
;
; 这个文件在板上是 /etc/dvr/camera.ini。放在这里的是【种子】：
; deploy.sh 发现板上没有该文件时会推过去，程序首次启动就会枚举并覆盖它。
; 所以指纹留空 = 一定不匹配 = 一定重新枚举，这是预期的。
;
; 字段说明：
;   card/bus/serial  VIDIOC_QUERYCAP + MEDIA_IOC_DEVICE_INFO 读到的设备指纹
;   queried          写入时间
;   count            下面 modeNN 的行数
;   modeNN=格式 宽 高 帧率
[camera]
version=1
card=
bus=
serial=
queried=
count=0
